[package]
name = "gpm-sync-server"
version = "0.1.0"
edition = "2021"
# jsonwebtoken 11 needs 1.88, the highest in the tree; the Dockerfile builds with a newer toolchain.
rust-version = "1.88"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
# rustls with the aws-lc-rs provider and the platform trust store; the
# runtime image installs ca-certificates for the Google JWKS fetch.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Same crypto backend as reqwest, so one provider is linked.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
